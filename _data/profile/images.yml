# Per-image-window default DESKTOP position / stacking.
# Key = slugified basename (the part after "win-img-" in the window id).
# left/top: CSS values. z: initial z-index. open: true shows it on page load.
# imgw: 창 안 사진의 폭 상한. 사진 파일이 252~368px 로 작아서 640px 창 안에서는
#   자연 크기 그대로 떠 있었고, 창을 줄여도 사진 크기가 안 변해 '안 줄어드는' 것처럼
#   보였다. 여기에 min(자연크기, vw) 를 주면 창 모양은 그대로 두고 사진만 화면에
#   비례해 줄어든다. (창을 사진에 맞춰 줄이면 정사각 사진 때문에 창까지 정사각이 됨)
# 좌표는 폭 2560급 화면에서 잡은 값이라 그보다 좁으면 이미 화면 밖이 된다(clampIntoView 가
# 강제로 끌어당기던 원인). min(px, vw/vh) 로 감싸 2560 이상에서는 그대로, 그 아래에서는 비례 축소.
# (On mobile these windows are full-screen sheets, so position is ignored and
#  open-by-default is suppressed — only the Blog window stays open on mobile.)
