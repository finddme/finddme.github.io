# Left-column folder menu. Order here = display order.
# type: skills | blog | links | projects
# source (links/projects only): github | email | collection:<name> | category:<Category Name>
# Optional per-window first-open position: default_left/default_top, e.g. "208px" or "12vw".
# 좌표는 1440x900 기준으로 잡은 값을 min(px, vw/vh) 로 감쌌다. 기준 이상 화면에서는 px 그대로,
# 그보다 좁으면 비례해 줄어 좁은 화면에서 창이 중앙 아트 위로 끌려오는 것을 막는다.
# Optional default_z sets the initial stacking order. default_open: true shows a window on page load.
- label: "Skills"
  id: "win-skills"
  filename: "skills.txt"
  type: "skills"
  default_left: "min(195.729px, 13.6vw)"
  default_top: "min(140.729px, 15.6vh)"
  default_z: 14
- label: "Sites"
  id: "win-blog"
  filename: "sites.txt"
  type: "blog"
  default_left: "min(443.25px, 27.395vw)"
  default_top: "min(93.4375px, 10.2566vh)"
  default_z: 54
  default_open: true
- label: "Official-Projects"
  id: "win-official"
  filename: "official_projects.rtf"
  type: "projects"
  source: "collection:official_projects"
  default_left: "min(812.385px, 56.4vw)"
  default_top: "min(53.3958px, 5.9vh)"
  default_z: 23
- label: "Personal-Projects"
  id: "win-personal"
  filename: "personal_projects.rtf"
  type: "projects"
  source: "collection:personal_projects"
  default_left: "min(314.53125px, 38.0328vw)"
  default_top: "min(309.375px, 33.9599vh)"
  default_z: 28
- label: "Dev-Logs"
  id: "win-devlog"
  filename: "dev_logs.rtf"
  type: "projects"
  source: "category:Dev Log"
  default_left: "min(883.062px, 61.3vw)"
  default_top: "min(322.062px, 35.8vh)"
  default_z: 26
- label: "GitHub"
  id: "win-github"
  filename: "github.txt"
  type: "links"
  source: "github"
- label: "Email"
  id: "win-email"
  filename: "email.txt"
  type: "links"
  source: "email"
