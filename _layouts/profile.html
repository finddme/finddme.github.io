<!DOCTYPE html>
<html lang="en-us">
  {% capture profile_head %}{% include head.html %}{% endcapture %}
  {% capture profile_css %}<link rel="stylesheet" href="{{ site.baseurl }}/public/css/profile-responsive.css?v={{ site.time | date: '%s' }}"></head>{% endcapture %}
  {{ profile_head | replace: '</head>', profile_css }}
  <body class="profile-desktop-page">
    {{ content }}
    <script src="{{ site.baseurl }}/public/js/profile-layout.js?v=3"></script>
    <script src="{{ site.baseurl }}/public/js/lab-spring.js?v=1"></script>
    <script src="{{ site.baseurl }}/public/js/profile-windows.js?v=38"></script>
    {% if site.google_analytics_token %}
      <script>
        (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
        ga('create', '{{ site.google_analytics_token }}', 'auto');
        ga('send', 'pageview');
      </script>
    {% endif %}
  </body>
</html>
